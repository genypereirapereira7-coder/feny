# Ambiente de desenvolvimento local (ARCHITECTURE.md §18).
# Uso: docker compose up

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: feny_dev
      POSTGRES_USER: feny
      POSTGRES_PASSWORD: feny
    ports:
      - "5432:5432"
    volumes:
      - feny_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feny"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: dev-inseguro-troque-em-producao
      DATABASE_URL: postgres://feny:feny@db:5432/feny_dev
    depends_on:
      db:
        condition: service_healthy

volumes:
  feny_db_data:
